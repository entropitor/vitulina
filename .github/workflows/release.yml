name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: vitulina-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-latest
            artifact: vitulina-linux-arm64
          - target: bun-darwin-x64
            os: macos-latest
            artifact: vitulina-darwin-x64
          - target: bun-darwin-arm64
            os: macos-latest
            artifact: vitulina-darwin-arm64
          - target: bun-windows-x64
            os: windows-latest
            artifact: vitulina-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm pkg set version="$VERSION"

      - name: Build single executable
        run: bun build --compile --target ${{ matrix.target }} --outfile ${{ matrix.artifact }} src/main.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vitulina-*
